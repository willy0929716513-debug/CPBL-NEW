name: 定期更新 CPBL 資料

# 這個 workflow 讓你不需要自己開電腦：GitHub 會在雲端的伺服器上，
# 依照下面的排程時間，自動執行爬蟲 + 資料驗證，並把最新結果 commit 回這個 repo。
#
# 想要「馬上更新一次」而不等排程時間到：
#   到這個 repo 的 Actions 分頁 -> 左側選「定期更新 CPBL 資料」-> 右上角
#   「Run workflow」按鈕 -> 直接按下去就會開始跑，全程不需要打開自己的電腦。

on:
  schedule:
    # UTC 20:00 = 台北時間隔天 04:00。中華職棒比賽通常在晚上結束，
    # 隔天凌晨抓資料可以確保前一天的戰績/數據都已經更新在官網上。
    # 想改頻率／時間，直接改這一行（cron 語法：分 時 日 月 星期）。
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cpbl-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲與資料驗證
        run: python -m cpbl_analytics.cli scrape

      - name: 提交更新後的資料快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要 commit。"
          else
            git commit -m "自動更新 CPBL 資料快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
